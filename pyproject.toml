[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nlp-rater"
version = "0.1.0"
description = "RATER competition models and experimentation utilities"
readme = "README.md"
requires-python = ">=3.10"

[project.optional-dependencies]
dev = ["pytest>=7"]

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]
include = [
    "rater*",
    "dataset*",
    "models*",
    "utils*",
    "metric*",
    "losses*",
    "fp1_07*",
    "fp1_sol01*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
